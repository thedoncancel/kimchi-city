<!doctype html>
<html><head><meta charset="utf-8"><title>Character viewer</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#20242c}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/vendor/three.module.js" } }</script>
</head><body>
<script type="module">
// Dev viewer for characters built by tools/build_char.py: ?char=kimchi
import * as THREE from 'three';
import { loadPhotoChar, makePhotoChar, animatePhotoRig } from '/src/3d/photochar.js';

const name = new URLSearchParams(location.search).get('char') || 'kimchi';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
// a hidden browser tab can report a 0x0 window, so fall back to a fixed size
const VW = innerWidth || 900, VH = innerHeight || 1100;
renderer.setPixelRatio(innerWidth ? Math.min(2, devicePixelRatio) : 1);
renderer.setSize(VW, VH);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#9fb8cc');
const camera = new THREE.PerspectiveCamera(35, VW / VH, 0.05, 100);
scene.add(new THREE.HemisphereLight('#dfeaff', '#6b5a48', 1.3));
const sun = new THREE.DirectionalLight('#fff4e4', 2.6);
sun.position.set(4, 6, 3); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3 });
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(4, 48), new THREE.MeshLambertMaterial({ color: '#c9c1b3' }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const res = await loadPhotoChar(name, '/assets/chars');
const t0 = performance.now();
const rig = makePhotoChar(res, { height: 1.7 });
const buildMs = performance.now() - t0;
scene.add(rig.root);

const state = { yaw: 0.5, dist: 4.2, h: 1.0, speed: 0, run: false, tpose: true, t: 0 };
function draw(dt = 1 / 60) {
  state.t += dt;
  if (!state.tpose) animatePhotoRig(rig, dt, { speed: state.speed, run: state.run, t: state.t });
  camera.position.set(Math.cos(state.yaw) * state.dist, state.h + 0.2, Math.sin(state.yaw) * state.dist);
  camera.lookAt(0, state.h, 0);
  renderer.render(scene, camera);
}
window.V = { THREE, rig, state, draw, renderer, buildMs,
  verts: rig.mesh.geometry.attributes.position.count,
  async grab(file) { draw(0); const url = renderer.domElement.toDataURL('image/jpeg', 0.85); return (await fetch('http://127.0.0.1:5199/' + file, { method: 'POST', body: url })).status; } };
draw();
</script>
</body></html>
